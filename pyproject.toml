[project]
name = "lawn-service-iq-mcp"
version = "1.1.0"
description = "Connect Lawn Service IQ to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No Lawn Service IQ API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["lawn-service-iq", "lawn-service-iq api", "lawn-service-iq mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/lawn-service-iq-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=lawn-service-iq"
Source = "https://github.com/cotlet-connect/lawn-service-iq-mcp"

[project.scripts]
lawn-service-iq-mcp = "lawn_service_iq_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"lawn_service_iq_agent.py" = "lawn_service_iq_agent.py"

[tool.hatch.build.targets.sdist]
include = ["lawn_service_iq_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
